version: '3.8'

services:
  # Nginx 리버스 프록시
  nginx:
    image: nginx:alpine
    container_name: edison-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - spring-app
      - ai-server
    restart: unless-stopped
    networks:
      - edison-network

  # Certbot SSL 인증서 자동 갱신
  certbot:
    image: certbot/certbot
    container_name: edison-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    networks:
      - edison-network

  # Spring Boot 애플리케이션
  spring-app:
    image: ${DOCKERHUB_USERNAME}/edison-spring:${SPRING_TAG:-latest}
    container_name: edison-spring
    expose:
      - "8080"
    environment:
      # Database
      - SPRING_DATASOURCE_URL=${RDS_URL}
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      # Redis - 컨테이너 이름으로 연결
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_EXPIRATION}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_EXPIRATION}
      # Google OAuth2
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      # OpenAI
      - OPENAI_SECRET_KEY=${OPENAI_KEY}
      # AWS
      - CLOUD_AWS_CREDENTIALS_ACCESS_KEY=${AWS_ACCESS_KEY}
      - CLOUD_AWS_CREDENTIALS_SECRET_KEY=${AWS_SECRET_KEY}
      - CLOUD_AWS_REGION_STATIC=ap-southeast-2
      - CLOUD_AWS_S3_BUCKET=${AWS_S3_BUCKET}
      # Server
      - SERVER_FORWARD_HEADERS_STRATEGY=framework
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edison-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI 서버 (FastAPI)
  ai-server:
    image: ${DOCKERHUB_USERNAME}/edison-ai:${AI_TAG:-latest}
    container_name: edison-ai
    expose:
      - "8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_KEY}
      # 필요한 환경변수 추가
    restart: unless-stopped
    networks:
      - edison-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Redis
  redis:
    image: redis:7-alpine
    container_name: edison-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - edison-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  edison-network:
    driver: bridge

volumes:
  redis-data: