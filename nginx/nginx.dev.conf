user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # HTTP -> HTTPS 리디렉션
    server {
        listen 80;
        listen [::]:80;
        server_name dev.teamedison.xyz;

        # Let's Encrypt 인증
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 헬스 체크
        location /health-check {
            return 200 'healthy';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 설정
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name dev.teamedison.xyz;

        # SSL 인증서 경로
        ssl_certificate /etc/letsencrypt/live/dev.teamedison.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dev.teamedison.xyz/privkey.pem;
        
        # 보안 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Let's Encrypt 인증
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /ai/ {
            # 프록시 (/ai/predict -> /predict)
            rewrite ^/ai/(.*) /$1 break;
            
            proxy_pass http://ai-server:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    
        location / {
            proxy_pass http://spring-app:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 20s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
